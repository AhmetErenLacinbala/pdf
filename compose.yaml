name: kagit-pdf

services:
  app:
    image: ${IMAGE_NAME:-ghcr.io/your-github-user/kagit-pdf-editor}:${IMAGE_TAG:-latest}
    container_name: kagit-pdf
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    networks:
      - traefik
    labels:
      traefik.enable: "true"
      traefik.docker.network: "${TRAEFIK_NETWORK:-proxy}"
      traefik.http.routers.kagit-pdf.rule: "Host(`${DOMAIN:?Set DOMAIN in .env}`)"
      traefik.http.routers.kagit-pdf.entrypoints: "websecure"
      traefik.http.routers.kagit-pdf.tls: "true"
      traefik.http.routers.kagit-pdf.tls.certresolver: "${TRAEFIK_CERT_RESOLVER:-letsencrypt}"
      traefik.http.services.kagit-pdf.loadbalancer.server.port: "8080"
      com.centurylinklabs.watchtower.enable: "true"
      com.centurylinklabs.watchtower.scope: "${WATCHTOWER_SCOPE:-default}"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

networks:
  traefik:
    name: ${TRAEFIK_NETWORK:-proxy}
    external: true
